name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'   
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync melt-rebase branch from upstream Pzqqt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync yudharn/Pzqqt-Melt-Rebase \
            -b melt-rebase \
            --source Pzqqt/android_kernel_xiaomi_marble
            

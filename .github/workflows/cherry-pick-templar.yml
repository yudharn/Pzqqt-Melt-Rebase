name: Cherry-pick commits dari kernel source

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repo sumber (owner/repo atau URL git)"
        default: "Steambot12/Templar-Kernel-GKI-5.10"
        required: true
      commits:
        description: "Commit (SHA lengkap), pisah spasi, urut dari lama ke baru"
        default: "fe1f62c1e003d491bb0f4806a2e6328fc9e6766d 081f3967784489a54aaa6b6aacdf56fd4c24ebb7"
        required: true
      base:
        description: "Branch dasar"
        default: "test-melt-rebase"
        required: true
      target:
        description: "Branch hasil (baru)"
        default: "templar-pick"
        required: true
      prefer_source:
        description: "Kalau konflik, pakai versi sumber (-X theirs)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0

      - name: Cherry-pick
        env:
          SRC: ${{ inputs.source_repo }}
          SHAS: ${{ inputs.commits }}
          TARGET: ${{ inputs.target }}
          PREFER: ${{ inputs.prefer_source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          case "$SRC" in
            http*|git@*) URL="$SRC" ;;
            *) URL="https://github.com/${SRC}.git" ;;
          esac
          git remote add src "$URL"

          for sha in $SHAS; do
            git fetch --no-tags src "$sha" || { echo "::error::Gagal fetch $sha"; exit 1; }
          done

          git checkout -b "$TARGET"

          OPTS=""
          if [ "$PREFER" = "true" ]; then OPTS="-X theirs"; fi

          FAILED=0
          for sha in $SHAS; do
            echo "=== cherry-pick -m 1 $sha ==="
            if ! git cherry-pick -m 1 $OPTS "$sha"; then
              echo "::error::Konflik di $sha"
              git status --short | grep -E '^(UU|AA|DU|UD|DD|AU|UA)' || true
              git cherry-pick --abort
              FAILED=1
              break
            fi
          done

          # push hasil yang berhasil (walau ada commit yang gagal)
          git push origin "$TARGET"

          exit $FAILED
          
